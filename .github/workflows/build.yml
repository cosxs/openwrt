name: Build firmware

# Runs daily and on demand. Each run first moves the pins in
# profiles/build.env to the latest upstream releases of the pinned OpenWrt
# series, of sing-box and of Hako. A scheduled run whose pins did not move
# stops there. Otherwise the run builds the image, checks what it contains, tests
# the network and system defaults on its root file system, boots it in a VM
# for the first-boot checks and a keep-settings upgrade, and keeps the image
# with its records as a workflow artifact. When the pins moved and every test
# passed, it commits the new pins to the branch it ran on. A newer OpenWrt
# release series is only reported, never taken. It publishes no release.
on:
  schedule:
    - cron: '37 19 * * *' # 03:37 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Move the pins to the latest upstream releases
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p .build
          ./scripts/update-pins.sh | tee .build/pin-changes.txt
          { grep '^notice: ' .build/pin-changes.txt || true; } | sed 's/^notice: /::warning::/'
          changed=false
          git diff --quiet -- profiles/build.env || changed=true
          build=true
          [[ $changed == false && $EVENT == schedule ]] && build=false
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          {
            echo '### Pins'
            if [[ $changed == true ]]; then
              grep -v '^notice: ' .build/pin-changes.txt | sed 's/^/- /'
            else
              echo 'All pins are at the latest upstream releases.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        if: steps.pins.outputs.build == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build
        id: build
        if: steps.pins.outputs.build == 'true'
        run: |
          ./scripts/build.sh
          dirs=(artifacts/*/*/)
          dir=${dirs[-1]}
          echo "dir=${dir%/}" >> "$GITHUB_OUTPUT"

      - name: Check the image contents
        if: steps.pins.outputs.build == 'true'
        env:
          DIR: ${{ steps.build.outputs.dir }}
        run: ./scripts/verify-image.sh "$DIR"/*-squashfs-rootfs.img.gz

      - name: Extract the root file system
        if: steps.pins.outputs.build == 'true'
        env:
          DIR: ${{ steps.build.outputs.dir }}
        run: |
          source profiles/build.env
          rootfs=$RUNNER_TEMP/rootfs
          gzip -dc "$DIR"/*-squashfs-rootfs.img.gz > "$RUNNER_TEMP/rootfs.img"
          docker run --rm --platform linux/amd64 --user root --network none \
            --mount "type=bind,source=$RUNNER_TEMP,target=/work" \
            "$IMAGEBUILDER_IMAGE" \
            /builder/staging_dir/host/bin/unsquashfs4 -q -d /work/rootfs /work/rootfs.img
          echo "ROOTFS=$rootfs" >> "$GITHUB_ENV"

      - name: Test the network defaults
        if: steps.pins.outputs.build == 'true'
        run: sudo tests/verify-network.sh "$ROOTFS"

      - name: Test the system defaults
        if: steps.pins.outputs.build == 'true'
        run: sudo tests/verify-system.sh "$ROOTFS"

      - name: Install the VM test tools
        if: steps.pins.outputs.build == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 ovmf wireguard-tools

      - name: Test in a VM
        if: steps.pins.outputs.build == 'true'
        env:
          DIR: ${{ steps.build.outputs.dir }}
        run: |
          work=/mnt/openwrt-vm
          [[ -d /mnt ]] || work=$RUNNER_TEMP/openwrt-vm
          sudo VM_WORK="$work" tests/vm/run.sh "$DIR"/*-squashfs-combined-efi.img.gz "$DIR" 2>&1 |
            tee "$DIR/vm-test.log"

      - name: Keep the image and its records
        if: always() && steps.build.outputs.dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ github.run_id }}
          path: |
            ${{ steps.build.outputs.dir }}/*-squashfs-combined-efi.img.gz
            ${{ steps.build.outputs.dir }}/*.manifest
            ${{ steps.build.outputs.dir }}/sha256sums
            ${{ steps.build.outputs.dir }}/build.env
            ${{ steps.build.outputs.dir }}/build-info.txt
            ${{ steps.build.outputs.dir }}/*.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit the new pins
        if: steps.pins.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profiles/build.env
          git commit -q -m 'Update pinned upstream versions' \
            -m "$(grep -v '^notice: ' .build/pin-changes.txt)"
          git pull -q --rebase origin "$BRANCH"
          git push -q origin "HEAD:$BRANCH"
