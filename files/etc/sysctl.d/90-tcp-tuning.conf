# TCP tuning for connections this router terminates itself, such as those of
# local services. Forwarded traffic is not affected.
# Loaded after 12-tcp-bbr.conf; override values in /etc/sysctl.conf.

# Larger maximum buffers for long, high-latency paths. Kernel minimum
# and default sizes are kept. A 32 MiB receive limit lets one connection
# advertise a window of about 14 MiB, enough for 400 Mbit/s at a 290 ms
# round trip.
net.core.rmem_max=33554432
net.core.wmem_max=23298048
net.ipv4.tcp_rmem=4096 131072 33554432
net.ipv4.tcp_wmem=4096 16384 23298048

net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_notsent_lowat=4096
net.core.netdev_max_backlog=4000
